name: bundle-unbundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unbundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble bundle and push branch
        run: |
          set -euo pipefail
          cat bundle-parts/chunk_* | tr -d '\n' | base64 -d > /tmp/transfer.bundle
          echo "62e84e0b627ebf5395e1df32326707601156fc6d130131b9b706654d68420779  /tmp/transfer.bundle" | sha256sum -c -
          git bundle verify /tmp/transfer.bundle
          git fetch /tmp/transfer.bundle refs/heads/claude/kondo-static-analyzer-v0fboy:refs/heads/transfer-target
          git push origin transfer-target:claude/kondo-static-analyzer-v0fboy
