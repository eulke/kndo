# GENERATED by `cargo xtask gen-ci` from kndo-gates' registry — edits land there,
# never here. The `generated_ci_is_current` gate fails when this file drifts.
name: v2

on:
  push:
    branches: [claude/proyecto-rediseno-greenfield-yg7bjp, main]
    paths: ["v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  workflow_dispatch:

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: v2

jobs:
  lint:
    name: lint (fmt, clippy, commit message)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: conventional commit (HEAD)
        run: |
          subject=$(git log -1 --format=%s)
          echo "$subject"
          case "$subject" in "Merge "*) exit 0;; esac
          echo "$subject" | grep -qE '^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,/_-]+\))?!?: .+' \
            || { echo "not a conventional commit"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows deferred by owner decision (tree-sitter-scss upstream) — v2/DECISIONS.md.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2
      - name: cargo test --workspace
        run: cargo test --workspace

  gates:
    name: named gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2
      - name: every named gate still exists
        run: |
          set -eu
          cargo test -p kndo-gates --test gates -- --list > /tmp/gate-list.txt
          missing=""
          for name in generated_ci_is_current; do
            grep -q "$name" /tmp/gate-list.txt || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "named gates missing from the harness:$missing"; exit 1; }
      - name: gate — generated_ci_is_current (the committed v2.yml byte-matches the generator)
        run: cargo test -p kndo-gates --test gates -- --exact generated_ci_is_current

  package-install:
    name: package + install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows deferred by owner decision (tree-sitter-scss upstream) — v2/DECISIONS.md.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2
      - name: package, exactly as a release will
        run: cargo run -p xtask -- package --tag v0.0.0-ci --out-dir dist
      - name: verify checksum, install and run from the artifact
        run: cargo run -p xtask -- verify-artifact --dir dist
