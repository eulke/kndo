# The user docs site (site/ — mdBook): built on every PR touching it so it can never rot, and
# deployed to GitHub Pages on pushes to main. If Pages isn't enabled for the repository, the
# deploy job fails visibly on main only — the build check still protects PRs.
name: Docs
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/docs.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/book

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
