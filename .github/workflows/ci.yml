# GENERATED by `cargo xtask gen-ci` from kndo-gates' registry — edits land there,
# never here. The `generated_ci_is_current` gate fails when this file drifts.
name: ci

on:
  push:
    branches: [claude/proyecto-rediseno-greenfield-yg7bjp, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (fmt, clippy, commit message)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: conventional commit (HEAD)
        run: |
          subject=$(git log -1 --format=%s)
          echo "$subject"
          case "$subject" in "Merge "*) exit 0;; esac
          echo "$subject" | grep -qE '^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,/_-]+\))?!?: .+' \
            || { echo "not a conventional commit"; exit 1; }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows builds since the SCSS grammar's build script is vendored with
        # its one portable flag (vendor/README.md); a platform the suite never ran
        # on is a platform a tag would meet first.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          # The ABI compliance suite builds the reference guests at run time; a
          # toolchain without this target dies with "can't find crate for `core`".
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  gates:
    name: named gates
    runs-on: ubuntu-latest
    env:
      # The loud-change gate diffs the range this run judges: a pull request's
      # base..head, or the pushed commit against its parent.
      KNDO_LOUD_RANGE: ${{ github.event.pull_request.base.sha && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: every named gate still exists
        run: |
          set -eu
          cargo test -p kndo-gates --test gates -- --list > /tmp/gate-list.txt
          missing=""
          for name in generated_ci_is_current contract_fingerprint_is_intentional dogfood_kndo_reports_nothing_on_itself warm_and_cold_runs_are_byte_identical threads_one_and_many_are_byte_identical incremental_and_full_assembly_are_byte_identical a_shared_cache_is_read_and_warmed_across_trees a_pinned_base_side_reports_the_bytes_of_a_fresh_one adapter_conformance_fixtures_are_byte_identical fixture_expectations_hold captured_transcripts_hold grammar_ledgers_hold finding_identity_is_unique contract_changes_are_loud dogfood_zero_means_measured report_schema_is_generated_and_valid agent_format_matches_its_committed_golden query_contract_is_generated_and_pinned frontends_import_only_the_facade builtin_plugin_proofs extension_dependency_implication abi_compat_matrix every_relative_markdown_link_resolves a_retired_mechanism_stays_retired; do
            grep -q "$name" /tmp/gate-list.txt || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "named gates missing from the harness:$missing"; exit 1; }
      - name: gate — generated_ci_is_current (the committed ci.yml byte-matches the generator)
        run: cargo test -p kndo-gates --test gates -- --exact generated_ci_is_current
      - name: gate — contract_fingerprint_is_intentional (a contract shape change updates fingerprint.txt in the same commit)
        run: cargo test -p kndo-gates --test gates -- --exact contract_fingerprint_is_intentional
      - name: gate — dogfood_kndo_reports_nothing_on_itself (kndo over this repository reports zero findings)
        run: cargo test -p kndo-gates --test gates -- --exact dogfood_kndo_reports_nothing_on_itself
      - name: gate — warm_and_cold_runs_are_byte_identical (cached, re-cached and uncached runs serialize identically)
        run: cargo test -p kndo-gates --test gates -- --exact warm_and_cold_runs_are_byte_identical
      - name: gate — threads_one_and_many_are_byte_identical (thread count never changes a byte of output)
        run: cargo test -p kndo-gates --test gates -- --exact threads_one_and_many_are_byte_identical
      - name: gate — incremental_and_full_assembly_are_byte_identical (a change replayed over cached evidence equals a from-scratch build)
        run: cargo test -p kndo-gates --test gates -- --exact incremental_and_full_assembly_are_byte_identical
      - name: gate — a_shared_cache_is_read_and_warmed_across_trees (a second tree over another tree's cache hits it, adds nothing for identical content, and reports the uncached bytes)
        run: cargo test -p kndo-gates --test gates -- --exact a_shared_cache_is_read_and_warmed_across_trees
      - name: gate — a_pinned_base_side_reports_the_bytes_of_a_fresh_one (a persisted base side composes the byte-identical comparison, under its own identity only)
        run: cargo test -p kndo-gates --test gates -- --exact a_pinned_base_side_reports_the_bytes_of_a_fresh_one
      - name: gate — adapter_conformance_fixtures_are_byte_identical (the harvested fixture corpus replays to its pinned reports)
        run: cargo test -p kndo-gates --test gates -- --exact adapter_conformance_fixtures_are_byte_identical
      - name: gate — fixture_expectations_hold (every fixture's expectations.toml holds: dead reported, alive unreported, known gaps still open)
        run: cargo test -p kndo-gates --test gates -- --exact fixture_expectations_hold
      - name: gate — captured_transcripts_hold (every fixture's transcript.json holds: the build tool that owns the manifest and the adapter that reads it answer the same)
        run: cargo test -p kndo-gates --test gates -- --exact captured_transcripts_hold
      - name: gate — grammar_ledgers_hold (every adapter's grammar.toml holds: every place the grammar puts a name has a verdict, every absence is argued for, and the run bears the claims out)
        run: cargo test -p kndo-gates --test gates -- --exact grammar_ledgers_hold
      - name: gate — finding_identity_is_unique (no two findings in any pinned report share an identity — every subject a file can hold twice carries its position)
        run: cargo test -p kndo-gates --test gates -- --exact finding_identity_is_unique
      - name: gate — contract_changes_are_loud (a changed pinned report, fingerprint or graph semantics version is named in DECISIONS.md by the same commits)
        run: cargo test -p kndo-gates --test gates -- --exact contract_changes_are_loud
      - name: gate — dogfood_zero_means_measured (every dogfood abstention is accepted in writing — zero cannot cheapen)
        run: cargo test -p kndo-gates --test gates -- --exact dogfood_zero_means_measured
      - name: gate — report_schema_is_generated_and_valid (the committed schema is derived from the types and validates real reports)
        run: cargo test -p kndo-gates --test gates -- --exact report_schema_is_generated_and_valid
      - name: gate — agent_format_matches_its_committed_golden (the agent render of the everything-specimen report is byte-pinned)
        run: cargo test -p kndo-gates --test gates -- --exact agent_format_matches_its_committed_golden
      - name: gate — query_contract_is_generated_and_pinned (query schemas are derived and valid, the agent render is byte-pinned, and used-by empties exactly where unused accused)
        run: cargo test -p kndo-gates --test gates -- --exact query_contract_is_generated_and_pinned
      - name: gate — frontends_import_only_the_facade (a frontend's production dependencies contain exactly one kndo crate: kndo)
        run: cargo test -p kndo-gates --test gates -- --exact frontends_import_only_the_facade
      - name: gate — builtin_plugin_proofs (every built-in conducting plugin proves its effect baseline-then-conduct, closed over the conduct subset of default_plugins)
        run: cargo test -p kndo-gates --test gates -- --exact builtin_plugin_proofs
      - name: gate — extension_dependency_implication (an extension named in another's dependencies activates even when its own rules never match)
        run: cargo test -p kndo-gates --test gates -- --exact extension_dependency_implication
      - name: gate — abi_compat_matrix (the pinned reference components still run against the HEAD host)
        run: cargo test -p kndo-gates --test gates -- --exact abi_compat_matrix
      - name: gate — every_relative_markdown_link_resolves (a relative Markdown link names a path that exists)
        run: cargo test -p kndo-gates --test gates -- --exact every_relative_markdown_link_resolves
      - name: gate — a_retired_mechanism_stays_retired (no name the design replaced is back in the tree, under any spelling)
        run: cargo test -p kndo-gates --test gates -- --exact a_retired_mechanism_stays_retired

  docs:
    name: docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: mdbook build
        run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/book

  deploy-docs:
    name: docs site deploys (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  corpus:
    name: corpus is measured and its findings are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: /tmp/kndo-corpus
          key: corpus-${{ hashFiles('corpus/corpus.toml') }}
      - name: clone the pinned corpus
        run: bash corpus/clone.sh /tmp/kndo-corpus
      - name: measure
        run: cargo run --release -p xtask -- corpus --corpus-dir /tmp/kndo-corpus
      - name: the committed measurement matches this code
        run: git diff --exit-code -- corpus-findings/

  package-install:
    name: package + install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: package, exactly as a release will
        run: cargo run -p xtask -- package --tag v0.0.0-ci --out-dir dist
      - name: verify checksum, install and run from the artifact
        run: cargo run -p xtask -- verify-artifact --dir dist
      # The Linux release artifact is musl — a static binary that runs on any
      # distribution — and the release build is the first time a musl binary
      # would otherwise exist. Built and run here on every push instead.
      - name: package the musl release target
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo run -p xtask -- package --target x86_64-unknown-linux-musl --tag v0.0.0-ci --out-dir dist-musl
          cargo run -p xtask -- verify-artifact --dir dist-musl
          ldd target/x86_64-unknown-linux-musl/release/kndo 2>&1 | grep -Eq "statically linked|not a dynamic executable" \
            || { echo "the musl release binary is not statically linked"; exit 1; }
      # The installer is a contract about the artifact's name and layout; until
      # it runs end to end against the producer's own output, nothing checks it.
      # Served over HTTP so every line it runs for a user runs here.
      - name: install through install.sh from the artifact just built
        if: runner.os != 'Windows'
        run: |
          served=dist; [ "$RUNNER_OS" = "Linux" ] && served=dist-musl
          (cd "$served" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          KNDO_VERSION=v0.0.0-ci KNDO_BASE_URL=http://127.0.0.1:8765 KNDO_INSTALL_DIR="$RUNNER_TEMP/kndo-bin" sh install.sh
          "$RUNNER_TEMP/kndo-bin/kndo" --version

  release-notes:
    name: release notes render (git-cliff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: the changelog config renders the unreleased commits
        run: git-cliff --config cliff.toml --unreleased --strip header
