name: Release

# The only human gesture is pushing a tag `vX.Y.Z`. The GitHub Release this
# workflow creates is the source of truth for every secondary channel — none of them compile
# anything, they all consume this run's own artifacts. If a secondary job fails, the release
# still shipped; only that one channel needs a retry.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gate every push/PR already passes (dtolnay/rust-toolchain, clippy, fmt, the full test
  # suite, kndo's own self-check) — called, not duplicated, so there is exactly one
  # definition of "green."
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl (Linux) needs `cross` — it produces a real static binary independent of the host's
      # glibc, and `cross` runs the build in a container with the musl toolchain preinstalled.
      # macOS and Windows build natively on their own runners: cross-compiling to them from
      # Linux costs more than it saves. Both macOS targets build on the same
      # (Apple Silicon) runner — Xcode's linker targets either arch without a second runner.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p kndo-cli --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p kndo-cli --target ${{ matrix.target }}

      # One producer for the artifact's name and layout, on every platform. Four channels
      # consume these archives — the installer, the Action, the Homebrew formula, the docs —
      # and `xtask/tests/release_channels.rs` checks each of them against this same code, so a
      # channel cannot drift from the release without failing a test on the PR that drifts it.
      # A `tar -czf` line here instead would be a second producer, and the layout is precisely
      # what two of those consumers used to get wrong.
      - name: Package
        shell: bash
        run: |
          set -eu
          asset=$(cargo run -p xtask --quiet -- package \
            --target ${{ matrix.target }} --tag "${GITHUB_REF_NAME}" --out-dir dist)
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs full history to generate notes since the last tag

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  publish-crates:
    name: publish-crates
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Dependency order (crates.io rejects a crate whose dependencies aren't indexed yet):
      # kndo-core -> kndo-adapter-toolkit -> each kndo-adapter-* / kndo-plugin-* -> kndo ->
      # kndo-cli. `--no-verify` is not used — each publish still builds from the packaged
      # crate, catching a manifest/packaging mistake before it reaches anyone. No manual
      # index-availability polling here: cargo (1.70+) already blocks `cargo publish` until the
      # crate is live in the index before returning — a hand-rolled wait loop would just
      # duplicate that, and would have leaned on `cargo search`, whose backing API crates.io
      # deprecates.
      #
      # NOT RUNNABLE AS-IS: the workspace has two real blockers, both
      # unrelated to this workflow. (1) `publish = false` at the workspace level (Cargo.toml) —
      # names are reserved ahead of publish; deliberate, not a bug, but it means
      # every one of these calls fails by design. (2) every internal dependency is
      # `{ path = "../foo" }` with no `version =` field — crates.io requires one on every
      # dependency of a published crate, path or not. Both need fixing together, when the
      # workspace is actually ready to publish.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          for crate in \
            kndo-core \
            kndo-adapter-toolkit \
            kndo-adapter-css \
            kndo-adapter-go \
            kndo-adapter-java \
            kndo-adapter-js \
            kndo-adapter-json \
            kndo-adapter-kotlin \
            kndo-adapter-rust \
            kndo-adapter-swift \
            kndo-plugin-api \
            kndo-plugin-nextjs \
            kndo-plugin-express \
            kndo \
            kndo-cli; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done

  update-tap:
    name: update-tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula
        working-directory: dist
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "$1" | awk '{print $1}'; }
          sha_macos_arm64=$(sha "kndo-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz")
          sha_macos_x86_64=$(sha "kndo-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz")
          sha_linux_arm64=$(sha "kndo-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl.tar.gz")
          sha_linux_x86_64=$(sha "kndo-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz")
          sed \
            -e "s/{{VERSION}}/${version}/g" \
            -e "s/{{SHA256_MACOS_ARM64}}/${sha_macos_arm64}/" \
            -e "s/{{SHA256_MACOS_X86_64}}/${sha_macos_x86_64}/" \
            -e "s/{{SHA256_LINUX_ARM64}}/${sha_linux_arm64}/" \
            -e "s/{{SHA256_LINUX_X86_64}}/${sha_linux_x86_64}/" \
            ../packaging/homebrew/kndo.rb.tmpl > kndo.rb

      # Needs the tap repo (e.g. eulke/homebrew-tap) to already exist and a token with push
      # access to it (secrets.HOMEBREW_TAP_TOKEN) — neither is assumed to exist yet.
      - name: Push formula to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/eulke/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/kndo.rb tap/Formula/kndo.rb
          cd tap
          git config user.name "kndo-release-bot"
          git config user.email "actions@github.com"
          git add Formula/kndo.rb
          git commit -m "kndo ${GITHUB_REF_NAME}" || echo "no changes to commit"
          git push

  publish-container:
    name: publish-container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Docker's TARGETARCH values (amd64/arm64) differ from Rust's target triples
      # (x86_64/aarch64) — stage each binary under the name the Dockerfile's
      # `COPY --from=bin kndo-linux-${TARGETARCH}` expects.
      - name: Stage per-arch binaries
        run: |
          set -eu
          mkdir -p ctx
          tar -xzf "dist/kndo-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" \
            -C ctx --strip-components=1 "kndo-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl/kndo"
          mv "ctx/kndo" "ctx/kndo-linux-amd64"
          tar -xzf "dist/kndo-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl.tar.gz" \
            -C ctx --strip-components=1 "kndo-${GITHUB_REF_NAME}-aarch64-unknown-linux-musl/kndo"
          mv "ctx/kndo" "ctx/kndo-linux-arm64"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-contexts: |
            bin=ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eulke/kndo:latest
            ghcr.io/eulke/kndo:${{ steps.tags.outputs.version }}
            ghcr.io/eulke/kndo:${{ steps.tags.outputs.minor }}
