# GENERATED by `cargo xtask gen-ci` from kndo-gates' release table — edits land
# there, never here. The `generated_ci_is_current` gate fails when this file drifts.
#
# A `v*` tag publishes; a dispatch with the tag is the escape hatch. The one
# producer of the artifact is `cargo xtask package`: this workflow never builds
# an archive by hand.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish (vX.Y.Z), verbatim"
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: package through xtask
        run: cargo run -p xtask -- package --target ${{ matrix.target }} ${{ matrix.cross && '--cross' || '' }} --tag "$TAG" --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums over every artifact
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: release notes
        run: git-cliff --config cliff.toml --unreleased --tag "$TAG" --strip header -o RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  update-tap:
    name: update-tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: render the formula from the template
        working-directory: dist
        run: |
          set -eu
          version="${TAG#v}"
          sha() { sha256sum "$1" | awk '{print $1}'; }
          sed -e "s/{{VERSION}}/${version}/g"             -e "s|{{SHA256:x86_64-unknown-linux-musl}}|$(sha "kndo-${TAG}-x86_64-unknown-linux-musl.tar.gz")|" \
            -e "s|{{SHA256:aarch64-unknown-linux-musl}}|$(sha "kndo-${TAG}-aarch64-unknown-linux-musl.tar.gz")|" \
            -e "s|{{SHA256:x86_64-apple-darwin}}|$(sha "kndo-${TAG}-x86_64-apple-darwin.tar.gz")|" \
            -e "s|{{SHA256:aarch64-apple-darwin}}|$(sha "kndo-${TAG}-aarch64-apple-darwin.tar.gz")|" \
            ../packaging/homebrew/kndo.rb.tmpl > kndo.rb
      # Needs the tap repository (eulke/homebrew-tap) and a token with push access
      # to it (secrets.HOMEBREW_TAP_TOKEN) — neither is assumed to exist yet.
      - name: push the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/eulke/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/kndo.rb tap/Formula/kndo.rb
          cd tap
          git config user.name "kndo release"
          git config user.email "release@kndo.invalid"
          git add Formula/kndo.rb
          git commit -m "kndo ${{ inputs.tag }}" || true
          git push
