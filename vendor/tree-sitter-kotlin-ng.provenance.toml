why = "Three constructs 1.1.0 gets wrong, one `choice` each. (1) Kotlin 2.1's `when` guard (`is String if x.isEmpty() -> …`): one guard ended the grammar's reading of the WHOLE file. A guard binds ONE condition, which is also what keeps it apart from an `if` expression opening the next condition after a comma. (2) Kotlin 2.0's multi-dollar string (`@Value($$\"${spring.exposed.url}\")`, where the placeholder must reach Spring unexpanded): the dollars and the quote they open are ONE token, because a free-standing `$$` competes with the `$` this grammar declares external and the lexer state resolving them is not local — measured, that shape cost `InsertTests.kt` 6522 bytes at an ordinary string with no multi-dollar in it. (3) A BODYLESS accessor now carries modifiers. `private set` is the only thing a bodyless accessor can be saying; with the modifiers optional a bare `get` was a complete getter, and Kotlin's `get`/`set` are ordinary identifiers everywhere else — so `T.insert { … } get T.id`, the infix spelling Exposed's own quick start uses, read as a property with a getter and cost its file the parse from there on. Measured together on Exposed: 61 error files -> 45, 147100 discarded non-space bytes -> 48013, 21809 declarations -> 23049."

