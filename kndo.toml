# kndo.toml — everything here is optional; every setting already has the default shown.
# Written by `kndo init`. Full reference: docs/src/configuration.md.

# [analysis]
# skip = []                              # categories or category:subject, e.g. ["unused:enum-member"]
# min-confidence = "possible"            # report floor; raise to "probable" to hide the
#                                        # speculative tier (--verbose always shows everything)

# [analysis.duplicate]
# min-tokens = 50

# [analysis.crap]
# threshold = 30

# [performance]
# threads = 0                            # 0 = physical cores; --threads flag wins

# [delta]                                # diff-mode gate budgets
# max-health-drop = 0.0
# max-net-findings = 0

# [[rule]]                               # per-path overrides
# paths = ["examples/**"]
# skip = ["unused"]

# [[externally-invoked]]                 # entry points only your framework knows about
# markers = ["Controller", "Bean"]       # annotations/attributes/decorators, by name
# paths = ["src/main/java/**"]           # optional scope; omit to apply project-wide

# Files consumed only through runtime path reads (Rust `PathBuf::join("…")` in xtask and
# the test suite) — reads no static analysis can see by construction
# (internal/detection-gaps.md). The schema files are additionally read by every consumer
# of the published output schema, outside this repo entirely.
[[rule]]
paths = ["schemas", "schemas/**", "internal/perf-baseline.json"]
skip = ["unused"]
