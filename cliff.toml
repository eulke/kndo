# git-cliff config (RFC 0014 §3.1) — categorizes commits by the type prefix CONTRIBUTING.md's
# Commits section already mandates (feat/fix/docs/refactor/perf/test/build/ci/chore/revert).
# Only ~45% of this repo's history actually carries that prefix (checked when RFC 0014 landed) —
# the catch-all "Other" group at the bottom of `commit_parsers` is not decorative, it's load-
# bearing: every un-prefixed commit subject lands there instead of vanishing from the changelog.

[changelog]
header = """
# Changelog\n
All notable changes to kndo are documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
            {% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Refactor" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^revert", group = "Reverts" },
    # Catch-all: every commit subject that doesn't match a type prefix above (RFC 0014 §3.1's
    # flagged gap — the ~55% of this repo's history with a plain descriptive subject instead of
    # a conventional-commit prefix) lands here rather than being silently dropped.
    { message = ".*", group = "Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
