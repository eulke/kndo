# The v2 workspace. It grows here, beside the v1 it replaces, until the root swap;
# nothing in it is a member of the v1 workspace and nothing in v1 depends on it.
[workspace]
resolver = "2"
members = [
    "crates/kndo",
    "crates/kndo-adapter-go",
    "crates/kndo-adapter-rust",
    "crates/kndo-adapter-ts",
    "crates/kndo-cli",
    "crates/kndo-contract",
    "crates/kndo-contract-fingerprint",
    "crates/kndo-core",
    "crates/kndo-coverage",
    "crates/kndo-gates",
    "crates/kndo-host-wasm",
    "crates/kndo-sdk",
    "crates/kndo-serve",
    "crates/kndo-testkit",
    "crates/kndo-toolkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false
