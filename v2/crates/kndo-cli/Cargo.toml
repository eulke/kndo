[package]
name = "kndo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kndo"
path = "src/main.rs"

[dependencies]
# The build shell: the shipped frontends carry the WASM component loader.
kndo = { path = "../kndo", features = ["wasm"] }
# Trimmed the way v1 measured it: `derive` for the Parser structs, the rest because
# clap's defaults pull suggestion/color machinery the binary doesn't need.
clap = { version = "4", features = ["derive", "std", "error-context", "help", "usage"], default-features = false }

tempfile = "3"
serde_json = "1"

[dev-dependencies]
kndo-testkit = { path = "../kndo-testkit" }
serde_json = "1"
