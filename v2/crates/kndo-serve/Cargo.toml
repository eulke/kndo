[package]
name = "kndo-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kndo-serve"
path = "src/main.rs"

[dependencies]
# The build shell: the shipped frontends carry the WASM component loader.
# `schema` because the tool listing advertises the query contract's own
# generated Options shape — one source, never a hand-written copy.
kndo = { path = "../kndo", features = ["wasm", "schema"] }
serde_json = "1"

[dev-dependencies]
kndo-testkit = { path = "../kndo-testkit" }
