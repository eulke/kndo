[package]
name = "kndo-adapter-toolkit"
description = "Shared adapter machinery: tree-sitter query helpers, token normalization, complexity walker — the paved road for first-party adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustc-hash = { workspace = true }
blake3 = { workspace = true }
kndo-core = { path = "../kndo-core" }
smol_str = { workspace = true }
tree-sitter = { workspace = true }
# JVM manifest parsing (Maven `pom.xml`) — only Java/Kotlin need it; every other adapter that
# depends on this crate skips compiling `roxmltree` entirely.
roxmltree = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: `metrics.rs`'s own tests use the TS grammar as a convenient concrete tree to
# exercise the (language-agnostic) complexity walker against — never a production dependency
# of this crate, so it costs nothing for a consumer that isn't kndo-adapter-js (which owns its
# own TS/TSX parser setup directly, not through this crate).
tree-sitter-typescript = { workspace = true }

[features]
jvm-xml = ["dep:roxmltree"]
