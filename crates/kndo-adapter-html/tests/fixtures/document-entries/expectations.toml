# document-entries: HTML pages are roots — script src and link href (stylesheet, modulepreload) with query suffixes stripped and commented-out tags ignored; a test page is a test root; a script src that resolves to no file is unresolved. An inline `<script>` or `<style>` is a region of its language: the JavaScript and CSS adapters read it in the page's coordinates, its imports resolve as JavaScript's (an extensionless `./src/util` finds `util.ts`), a module's dead function is the page's finding, a classic script's function is the page's global, and an import map is data, not code.

