[package]
name = "kndo-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4"
kndo-contract-fingerprint = { path = "../kndo-contract-fingerprint" }
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
blake3 = "1"
schemars = { version = "1", features = ["smol_str03"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
schema = ["dep:schemars"]
