[package]
name = "kndo-cli"
description = "The kndo command-line frontend: terminal UI, exit codes, human rendering. Zero analysis logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kndo"
path = "src/main.rs"

[dependencies]
kndo = { path = "../kndo", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# Restoring SIGPIPE's default disposition at startup (see main.rs) — Unix only; Windows has
# no SIGPIPE and the cfg gate keeps this dependency off that target entirely.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
smol_str = { workspace = true }
# `shell_configuration_is_buildable` reads this manifest.
toml = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
# The product's default set lives in `kndo`'s manifest and is read from there:
# `kndo/default` is one entry that cannot drift from what the library enables. It used to be
# the twenty names spelled out again, and they did drift — `kndo:uikit` was registered in the
# library and shipped in no binary at all, which looks exactly like a plugin that does not
# work. A guard test caught that one and named the missing feature; the guard is gone with
# this commit, because a list that cannot diverge needs no watching.
#
# The named passthroughs below stay: they are the public knob, and the reason `default-features
# = false` is on the dependency at all. They let CI build the "shell" configuration —
# `--no-default-features --features external-adapters,plugin-install`: a lean host that loads
# WASM components and ships zero first-party grammars, real and CI-proven rather than only
# documented. This crate has no `cfg(feature = ...)` of its own; every feature here forwards
# and nothing else.
default = ["kndo/default"]
js = ["kndo/js"]
go = ["kndo/go"]
rust = ["kndo/rust"]
java = ["kndo/java"]
kotlin = ["kndo/kotlin"]
swift = ["kndo/swift"]
json = ["kndo/json"]
css = ["kndo/css"]
html = ["kndo/html"]
external-adapters = ["kndo/external-adapters"]
plugin-nextjs = ["kndo/plugin-nextjs"]
plugin-express = ["kndo/plugin-express"]
plugin-serde = ["kndo/plugin-serde"]
plugin-info-plist = ["kndo/plugin-info-plist"]
plugin-thymeleaf = ["kndo/plugin-thymeleaf"]
plugin-libsass = ["kndo/plugin-libsass"]
plugin-uikit = ["kndo/plugin-uikit"]
plugin-rkyv = ["kndo/plugin-rkyv"]
plugin-wasmtime = ["kndo/plugin-wasmtime"]
plugin-coverage = ["kndo/plugin-coverage"]
plugin-install = ["kndo/plugin-install"]
