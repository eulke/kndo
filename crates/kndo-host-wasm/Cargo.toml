[package]
name = "kndo-host-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kndo-contract = { path = "../kndo-contract" }
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
wasmtime = { version = "=27.0.0", default-features = false, features = [
    "component-model",
    "runtime",
    "cranelift",
    "cache",
    "parallel-compilation",
] }

[dev-dependencies]
kndo-core = { path = "../kndo-core" }
kndo = { path = "../kndo" }
kndo-testkit = { path = "../kndo-testkit" }
tempfile = "3"
wit-component = "0.219"
