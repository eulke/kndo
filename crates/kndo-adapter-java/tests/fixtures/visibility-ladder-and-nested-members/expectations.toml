# visibility-ladder-and-nested-members: each rung of Java's visibility ladder against the scope its uses require, with nested members judged under their owner. In the (unpublished) test set, `protected` reaches the owner, its subtypes and the package: used in the owner alone, `private` would suffice; used from the package and no subtype, `package-private` would; used from a subtype, its own word; used by nobody, `unused`. In the published main set a protected member of a public type is published surface, and no advice is given.

