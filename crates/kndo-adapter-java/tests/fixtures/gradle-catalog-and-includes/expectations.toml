# gradle-catalog-and-includes: the build `cargo xtask capture` runs Gradle on,
# and the one place the reader and Gradle read the same tree. Its three shapes
# are the ones a line scanner gets wrong — an `include(` across lines, a
# commented-out include, and a dependency the script names only through the
# version catalog — plus a source set that adds a directory the layout does not
# imply. `kndo-report.init.gradle` beside them is the question the capture asks
# Gradle with; nothing claims it, and Gradle applies it only when named.

