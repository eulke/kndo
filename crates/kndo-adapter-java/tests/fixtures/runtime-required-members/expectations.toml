# runtime-required-members: what a base OUTSIDE the project requires. The graph
# can never resolve `Comparable` or `Serializable`, so java's spec names them
# and the members they require; the engine keeps those as witnesses of the
# base, alive while their owner is and of no color. A type that promised
# nothing gets no such keeper, which is what makes the rule a rule and not a
# name list — and a rule written with the FULL name reaches only the base the
# file's own imports say it is.

[[alive]]
subject = "src/main/java/com/foo/Ticket.java#Ticket.compareTo(Ticket)"
category = "unused"
because = "witness:Comparable:rule:kndo:java#4"
why = "Comparable requires it; no call site names it and no supertype in this project declares it"

[[alive]]
subject = "src/main/java/com/foo/Ticket.java#Ticket.writeObject(ObjectOutputStream)"
category = "unused"
because = "witness:Serializable:rule:kndo:java#13"
why = "the serialization runtime calls it reflectively — private, so nothing else could keep it"

[[alive]]
subject = "src/main/java/com/foo/Ticket.java#Ticket.readObject(ObjectInputStream)"
category = "unused"
because = "witness:Serializable:rule:kndo:java#13"
why = "the same hook, the other direction"

[[dead]]
subject = "src/main/java/com/foo/Ticket.java#Ticket.auditTrail()"
category = "unused"
why = "private, unnamed, and required by nothing — the control beside the hooks"

[[dead]]
subject = "src/main/java/com/foo/Plain.java#Plain.writeObject(java.io.ObjectOutputStream)"
