subject = "src/main/java/demo/Shape.java#Shape.area()"
why = "abstract and called through `describe`; Square overrides it, so narrowing is a compile error, not advice"

[[alive]]
subject = "src/main/java/demo/Square.java#Square.area()"
why = "a witness of Shape's surface: every caller holds a Shape and dispatches through it"

