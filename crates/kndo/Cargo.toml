[package]
name = "kndo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kndo-adapter-css = { path = "../kndo-adapter-css" }
kndo-adapter-go = { path = "../kndo-adapter-go" }
kndo-adapter-html = { path = "../kndo-adapter-html" }
kndo-adapter-java = { path = "../kndo-adapter-java" }
kndo-adapter-kotlin = { path = "../kndo-adapter-kotlin" }
kndo-adapter-python = { path = "../kndo-adapter-python" }
kndo-adapter-swift = { path = "../kndo-adapter-swift" }
kndo-adapter-rust = { path = "../kndo-adapter-rust" }
kndo-adapter-ts = { path = "../kndo-adapter-ts" }
kndo-apple = { path = "../kndo-apple" }
kndo-packs = { path = "../kndo-packs" }
kndo-contract = { path = "../kndo-contract" }
kndo-core = { path = "../kndo-core" }
kndo-coverage = { path = "../kndo-coverage" }
kndo-host-wasm = { path = "../kndo-host-wasm", optional = true }

[features]
# The build-shell feature: sessions opened through `open()` also load external
# WASM components from `<root>/.kndo/plugins/`. The shipped `kndo` binary turns
# it on; embedders that want no wasmtime in their tree simply don't.
wasm = ["dep:kndo-host-wasm"]
# Schema generation doors (`query::options_schema` and friends) for frontends
# that advertise the contract — serve's tool listing derives from the same
# types the door parses.
schema = ["kndo-core/schema"]

[dev-dependencies]
kndo-testkit = { path = "../kndo-testkit" }
