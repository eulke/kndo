[package]
name = "kndo-plugin-coverage"
description = "Built-in kndo:coverage-* ingesters — lcov, Cobertura XML, JaCoCo XML, Go coverprofile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kndo-core = { path = "../kndo-core" }
smol_str = { workspace = true }
# The two XML report formats (Cobertura, JaCoCo). Dependency-free read-only DOM already
# in the workspace tree (kndo-adapter-toolkit) — real reports carry DOCTYPEs, entities and
# writer-dependent self-closing tags, which a hand-rolled "subset" scanner gets wrong.
roxmltree = { workspace = true }
