[package]
name = "kndo-plugin-api"
description = "kndo-plugin-api: the versioned WASM component-model ABI external adapters/plugins target. Host-side bridge only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kndo-core = { path = "../kndo-core" }
smol_str = { workspace = true }
rustc-hash = { workspace = true }
# WasmPlugin's Plugin::content_hash: the graph cache key needs the component's
# own content identity, not just its declared id/version — same hasher kndo-core's own cache
# and graph keys use.
blake3 = { workspace = true }
# Pinned to the last major compatible with this workspace's toolchain — the ABI is versioned
# and conservative, and the same discipline applies to its own runtime dependency, not just
# the WIT surface.
wasmtime = { version = "=27.0.0", features = ["component-model"] }

[dev-dependencies]
wit-component = "0.219"
tempfile = { workspace = true }
# The compliance/compat-matrix test suites drive a real end-to-end LanguageAdapter; the
# `testkit` feature exposes kndo-core's own MockAdapter for this instead of reimplementing
# its grammar in this crate.
kndo-core = { path = "../kndo-core", features = ["testkit"] }
