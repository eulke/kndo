[package]
name = "kndo-plugin-express"
description = "Built-in kndo:express plugin — script-launched entry files the import graph can't see"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kndo-core = { path = "../kndo-core" }
smol_str = { workspace = true }
# Parses package.json's main/scripts through the content channel to derive the
# true entry file instead of guessing by name alone.
serde_json = { workspace = true }
