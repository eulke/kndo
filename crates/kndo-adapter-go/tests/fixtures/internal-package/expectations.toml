# internal-package: internal/ is never library-promoted — an internal file nothing imports is `unused` as a whole, while a top-level export is a production root.

[[dead]]
subject = "internal/util/helper.go"
category = "unused"
why = "internal/ is not externally consumed by definition — never promoted, and nothing in-repo imports the file"

[[alive]]
subject = "lib.go#PublicAPI"
why = "exported from a non-internal, non-test file: library-mode promotion makes it a production root with zero in-repo callers"
