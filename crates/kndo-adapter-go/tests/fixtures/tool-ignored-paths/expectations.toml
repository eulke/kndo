# tool-ignored-paths: what the go tool never compiles — a `_`-prefixed file, the module copies under `vendor/` — is discovered and never claimed: no evidence, no unit, no verdict, and the vendored module's `go.mod` declares no package of this project. A `testdata` or `_`-prefixed directory is NOT one: `./...` skips it, and an import compiles it — so its files are claimed and the import resolves. The pinned report holds the project's own findings alone.

