# string-annotations: a forward annotation is a type by another spelling. `x: "_Later"`
# names `_Later` exactly as the unquoted form does — the quotes exist because the name
# is not bound yet at that point, and an adapter that reads only identifiers sees a
# string literal and calls the class dead. The class beside it, named by nothing, stays
# accused.

