[project]
name = "spellings"
version = "0.1.0"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "blinker>=1.9.0",
    "click >= 8.1.3",
    "itsdangerous",
    "flask-sqlalchemy[async]>=3.0; python_version>'3.9'",
    "Flask_SQL.Alchemy",
    "gha-update ; python_full_version >= '3.12'",
    "importlib-metadata>=3.6; python_version<'3.10'",
    "zope.interface",
    "ruamel.yaml.clib>=0.2.7",
    "types-contextvars",
    "sphinx<9",
    "pytest==7.*",
    "name @ https://example.com/name.zip",
    "A.B_c-D",
]

[project.scripts]
spell = "app:serve"

[tool.setuptools]
package-dir = {"" = "src"}
