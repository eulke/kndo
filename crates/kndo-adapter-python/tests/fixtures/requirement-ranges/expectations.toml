# requirement-ranges: two manifests of one distribution asking different things
# of the same dependency. What a PEP 508 specifier reads as is what decides:
# `>=3.1.0` and `==2.3.3` cannot both hold, `>=8.1.3` and `==8.1.3` can, and a
# requirement with no specifier at all asks nothing and is compared with
# nothing.

[[dead]]
subject = "dep:pyproject.toml:werkzeug"
category = "version-skew"
why = "`>=3.1.0` here and `==2.3.3` in requirements.txt name ranges that cannot both hold — the pinned file has drifted below what the distribution requires"

[[alive]]
subject = "dep:pyproject.toml:click"
category = "version-skew"
why = "`>=8.1.3` here admits the `==8.1.3` beside it: two texts, one resolvable requirement, and nothing to report"

[[alive]]
subject = "dep:pyproject.toml:celery"
category = "version-skew"
why = "this file names `celery[redis]` with no specifier, which states no requirement at all — a comparison the manifest does not enable stays silent"
