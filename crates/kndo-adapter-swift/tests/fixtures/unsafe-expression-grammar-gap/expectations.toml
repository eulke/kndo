# unsafe-expression-grammar-gap: what a construct the pinned grammar cannot read
# costs, when the answer is NOTHING — and the fixture is here to say so, and to
# move the day either half of that changes.
#
# `unsafe expr` is Swift 6.2's strict-memory-safety form. Measured against
# tree-sitter-swift 0.7.3 by reproduction, one construct at a time: `sending`,
# `#warning`, `#error` (at top level and in a body), `if`/`switch` expressions,
# typed `throws(E)` and `~Copyable` all PARSE. This one does not, and it is the
# only one of the seven that does not — 19 of vapor's 251 Swift files carry it.
#
# What it costs: the keyword. `run.extensions[]` reports `unread { files: 1,
# names: 1 }` for `kndo:swift`, and every verdict below is the one a reader that
# had understood the line would reach. That pair is the whole claim: the gap is
# VISIBLE and it is HARMLESS, and the pinned report holds both halves. The day
# the grammar learns the form the map goes to zero and this fixture stops
# testing anything, exactly as three Kotlin fixtures have already had to be
# re-pointed; the day the gap widens, a verdict below moves.

[[dead]]
subject = "Sources/App/Box.swift#Box.go"
category = "unused"
why = "nothing calls it — `main.swift` reaches `read` and nothing reaches `go`, and the unreadable line inside it changes neither"

[[alive]]
subject = "Sources/App/Box.swift#Sink.forgotten"
category = "unused"
why = "called from the line the grammar could not place, and the CALL survives the break even though the `unsafe` before it does not: the reference walk reads `sink.forgotten()` out of the ERROR"

[[dead]]
subject = "Sources/App/Box.swift#Sink.forgotten"
category = "internal-only"
why = "the positive claim the surviving reference buys: its one use is inside its own file, so `internal` is not earned — a reader that had lost the call could not say this"
