# protocol-requirement-reach: a member that sits on a promised surface cannot be
# narrowed, and Swift writes that promise in one list its grammar does not separate.
# The relation stream answers both directions — what a subtype overrides, and what a
# protocol requires — and must leave everything else advisable.

[[alive]]
subject = "Sources/App/Shape.swift#Square.area"
category = "internal-only"
why = "`Rounded` overrides it, so narrowing it below what the overrider needs is a compile error, not advice — the relation `Rounded: Square` is the whole of that evidence"

[[dead]]
subject = "Sources/App/Shape.swift#Square.perimeter"
category = "internal-only"
why = "nothing overrides it and nothing outside this file names it — the advice the relation must NOT suppress"

[[dead]]
subject = "Sources/App/Shape.swift#Cube.volume"
category = "internal-only"
why = "a conforming type's OTHER members promise nothing and are advisable like any other. This was a known gap while every non-private method of a type declaring ANY conformance carried a blanket `Possible` root; that root named no protocol and no requirement, so it was a silence with a confidence attached rather than a rule, and it is gone. What replaces it is `Trigger::ExternalWitness`, which says the same thing honestly because it has to name the base"
