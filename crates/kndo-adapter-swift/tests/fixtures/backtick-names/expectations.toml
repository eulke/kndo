# backtick-names: the quotes are spelling, never name. A declaration written
# `` `default` `` and a use written `.default` are one name, and so are the reverse —
# without that, both sides read as dead. Beside it, the VALUE of a property binding:
# `let chosen = seed` is a use of `seed`, which naming the parent kind a binder seat
# used to throw away.

