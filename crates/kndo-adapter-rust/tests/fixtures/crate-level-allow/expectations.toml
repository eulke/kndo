# crate-level-allow: a crate root's `#![allow(dead_code)]` speaks for the whole crate, every module file included.

[[alive]]
subject = "src/lib.rs#api"
why = "the crate root is a manifest entry; its exported surface is the crate's"

[[alive]]
subject = "src/inner.rs#stale"
category = "unused"
why = "rustc scopes a crate-root inner attribute to the crate: the marker claims the UNIT, `src/lib.rs` is the file cargo enters the unit through, and the claim reaches every file the unit compiles"
