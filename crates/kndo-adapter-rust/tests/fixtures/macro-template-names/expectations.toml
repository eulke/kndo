# macro-template-names: paths inside a `macro_rules!` template are uses; a pub(crate) fn used only in its own file is internal-only, not unused.

[[alive]]
subject = "src/messages.rs#set_flag"
category = "unused"
why = "named as crate::messages::set_flag inside the log_err! template that lib.rs expands — the mention is a reference, and a reference keeps it"

[[alive]]
subject = "src/messages.rs#set_flag"
category = "internal-only"
why = "the use is at every EXPANSION site, not where the template is written. The mention is a reference performed ELSEWHERE (`Performed::Elsewhere`), which keeps the declaration alive and states no site — so this file's own evidence is no longer read as proof that nobody outside names it, and no narrower rung is advised. The reference that TRAVELS, which this gap asked for"

[[dead]]
subject = "src/messages.rs#local_only"
category = "internal-only"
why = "declared pub(crate), but every use is within its own file"

[[alive]]
subject = "src/messages.rs#local_only"
