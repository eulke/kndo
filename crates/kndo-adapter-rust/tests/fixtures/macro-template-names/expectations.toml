# macro-template-names: paths inside a `macro_rules!` template are uses; a pub(crate) fn used only in its own file is internal-only, not unused.

[[alive]]
subject = "src/messages.rs#set_flag"
category = "unused"
why = "named as crate::messages::set_flag inside the log_err! template that lib.rs expands — the mention is a reference, and a reference keeps it"

[[known_gap]]
subject = "src/messages.rs#set_flag"
expect = "alive"
category = "internal-only"
why = "the use is at every EXPANSION site, not where the template is written — narrowing this below `pub(crate)` breaks call sites no reference in this file records. The template's mention is now a reference (the plan's shape for names inside macro token trees), which keeps the declaration alive but pools the use in its own file, so the ladder advises a rung the macro cannot live at"
fix = "a reference that TRAVELS: the design has no coordinate for a use recorded in one file and performed in another, and `macro_rules!` is the case that needs one. The root this replaced suppressed the advice by accident rather than by saying anything"

