# attribute-dispatch: attributes are markers, and the spec's dispatch rules say what they mean — a linkage attribute roots Production, the dead-code lint's escape hatches exempt, a file-level blanket exempts everything and is reported.

[[dead]]
subject = "src/ffi.rs#truly_dead"
category = "unused"
why = "nothing calls it and no attribute speaks for it — `src/scratch.rs`'s file-top blanket claims the unit, but cargo enters this unit through `src/main.rs`, so the claim stops at the file that wrote it"

[[alive]]
subject = "src/ffi.rs#exported_symbol"
because = "rule:kndo:rust#7"
why = "#[unsafe(no_mangle)] unwraps to no_mangle: the linker exports it — a dispatched Production root"

[[alive]]
subject = "src/ffi.rs#kept_on_purpose"
because = "rule:kndo:rust#17"
why = "#[allow(dead_code)] exempts it: the source already answered the question"

[[alive]]
subject = "src/ffi.rs#expected_unused"
because = "rule:kndo:rust#21"
why = "#[expect(unused)] exempts it: the author asked the compiler for exactly this lint"

[[alive]]
subject = "src/ffi.rs#tests.touches"
why = "#[test] roots it Test — a dispatched root, and a member of the cfg(test)-rooted inline module that holds it"

[[alive]]
subject = "src/scratch.rs#draft_one"
why = "#![allow(dead_code)] at the top of a module file exempts every declaration in it; the run reports the blanket as a diagnostic"

[[alive]]
subject = "src/scratch.rs#draft_two"
why = "the same file-level blanket"
