# test-only-and-cycle: a ping/pong module cycle is tolerated in Rust (never a finding); fixture_helper is production-reachable through the lib's mount, so it is not test-only; ping and pong are untested; and an exported fn of a `publish = false` crate that nothing names is dead, since a mount hands out no surface.

