[package]
name = "kndo-adapter-rust"
description = "Rust language adapter for kndo (docs/adapters/rust.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kndo-core = { path = "../kndo-core" }
kndo-adapter-toolkit = { path = "../kndo-adapter-toolkit" }
smol_str = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
toml = { workspace = true }

# kndo's own dogfood flagged this `test-only` the day sub-file test regions landed: every
# rustc_hash use sits inside a #[cfg(test)] module.
[dev-dependencies]
rustc-hash = { workspace = true }
