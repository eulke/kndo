# recovered-under-error: what a parse error costs, and what the pair of walks buys back.
# The break here is a context parameter (Kotlin 2.2), a clause the pinned grammar does not
# know, in the arrangement Exposed's `Entity.kt` has it: recovery ends the class at the
# break, so `class Cache` is not a node at all, `invalidate` and `neverCalled` above it
# survive as `function_declaration`s under the ERROR, and everything after it — `refresh`
# and the `invalidate()` call inside it — is text NO node covers.
#
# The break has moved twice, and that is the fixture working. It was a `when` guard, then an
# infix `get`; each time the grammar learned the construct, this file stopped erroring and
# stopped testing anything, and had to be re-pointed at one the grammar still gets wrong.
#
# The two survivors are therefore spelled WITHOUT an owner: the class node they were written
# in no longer exists, so the item walk surfaces them at file level and the sink names them
# there. That is the honest reading — a fragment is what the grammar still says it is, and
# nothing left in the tree says whose member it was.
#
# Both are invisible without the item walk: the one-level walk stops at the ERROR and the
# file yields only `cache`. With the item walk ALONE both are reported dead, because the call
# that keeps one of them alive was never a node. The two rows below are the whole argument
# for the reader STATING the discarded text: recovering declarations without accounting for
# the uses in the same region does not find dead code, it manufactures it.
#
# And they are the argument for stating it as UNREAD rather than reading names out of it as
# uses. A name in discarded text is not a use — nobody read a call there — so it keeps
# nothing: `used-by` on `invalidate` answers `kept_by: []`. What it does instead is stop the
# accusation: the run answers `names-in-unread-text { names: 1 }`, and that one is
# `invalidate`. Nothing keeps it and it is still not judged, which is the whole difference
# between abstaining and guessing in the accused's favour.

[[alive]]
subject = "src/main/kotlin/demo/Cache.kt#invalidate"
category = "unused"
why = "`refresh` calls it, and `refresh` is text the parse discarded — the name appears in text no reader accounted for, so a verdict resting on its absence abstains; it is the one declaration the run's `names-in-unread-text` counts"

[[alive]]
subject = "src/main/kotlin/demo/Cache.kt#invalidate"
category = "internal-only"
why = "no use was found at all, and `internal-only` speaks only about where the uses ARE; total absence is the subject of `unused`, which abstains over it. The `internal-only` this fixture used to pin was the invented reference talking."

[[dead]]
subject = "src/main/kotlin/demo/Cache.kt#neverCalled"
category = "unused"
why = "recovered from under the same ERROR and named nowhere — not in a node, and not in the discarded text either, which is what tells it apart from the row above: the true positive the item walk buys"

[[alive]]
subject = "src/main/kotlin/demo/Cache.kt#cache"
category = "unused"
why = "called from `main`; it sits before the break, so it parses normally and reaches the file"
