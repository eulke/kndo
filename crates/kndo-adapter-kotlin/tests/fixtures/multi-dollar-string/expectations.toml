# multi-dollar-string: Kotlin 2.0's `$$"…"`, and what it means. A run of two or more `$`
# before the quote raises how many dollars an interpolation needs, so `${spring.exposed.url}`
# under a `$$` prefix is TEXT — the placeholder has to reach Spring unexpanded. The pinned
# grammar does not know the construct and gives `Config.kt` up entirely.
#
# `spring` is written nowhere in this project except inside that string's body, which is what
# makes the file worth keeping: whenever the construct IS read, `spring` must be dead, since a
# `$` there does not interpolate. Today nothing in the file is judged at all.

[[known_gap]]
subject = "src/main/kotlin/demo/waste/Waste.kt"
expect = "dead"
category = "unused"
why = "plainly dead and in a file that parses — but `Config.kt` yields no declarations, `main` among them, so the run finds no root anywhere and abstains whole-run"
fix = "grammars: the pinned Kotlin grammar reads the construct. Unread text has SHIPPED and does not close this one: what the break costs here is the file's root, and a reader stating what it could not account for can withhold an accusation, never manufacture the root that would let one be made"

[[known_gap]]
subject = "src/main/kotlin/demo/Config.kt#spring"
expect = "dead"
category = "unused"
why = "its only occurrence outside its own declaration is inside the multi-dollar string's body, where a `$` does not interpolate — so it is dead, and a run that read the construct would say so"
fix = "grammars: the pinned Kotlin grammar reads a multi-dollar string"
