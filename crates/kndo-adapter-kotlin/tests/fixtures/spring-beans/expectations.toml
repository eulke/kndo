# spring-beans: a stereotype annotation is the whole of the evidence that something
# outside the graph constructs a class — the rule pack says what the marker MEANS, and
# the class beside it, identical but unannotated, stays dead.

[[alive]]
subject = "src/main/kotlin/demo/HelloController.kt#HelloController"
category = "unused"
why = "`@RestController` is a stereotype the container instantiates by component scan; nothing in the project names it and nothing has to"

[[alive]]
subject = "src/main/kotlin/demo/HelloController.kt#HelloController.hello"
category = "unused"
why = "`@GetMapping` is a handler the container calls on a bean it already holds — a witness of its owner, not a root of its own"

[[dead]]
subject = "src/main/kotlin/demo/Plain.kt#Plain"
category = "unused"
why = "the same shape with no annotation: no marker, no rule, no root — which is what keeps the pack from silencing everything it does not mean"
