[[alive]]
subject = "scripts/releaseUtils.ts"
category = "unused"
why = "imported by the workflow-launched detect-release.ts"

[[alive]]
subject = "tools/render-notes.mjs"
category = "unused"
why = "launched by `node render-notes.mjs` under the step's working-directory: tools"

[[alive]]
subject = ".github/actions/report/render.mjs"
category = "unused"
why = "launched by the composite action's `node $GITHUB_ACTION_PATH/render.mjs`"

[[alive]]
