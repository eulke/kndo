# workflow-launched-scripts: GitHub workflow steps and composite actions launch scripts (working-directory and $GITHUB_ACTION_PATH honored) — those roots keep their imports alive; a script nothing launches is unused.

[[dead]]
subject = "scripts/orphan.ts"
category = "unused"
why = "no workflow step, action or package script launches it and nothing imports it"

