[workspace]
resolver = "2"
members = [
    "crates/kndo",
    "crates/kndo-core",
    "crates/kndo-cli",
    "crates/kndo-adapter-toolkit",
    "crates/kndo-adapter-js",
    "crates/kndo-adapter-go",
    "crates/kndo-adapter-rust",
    "crates/kndo-adapter-java",
    "crates/kndo-adapter-kotlin",
    "xtask",
]
exclude = ["spikes/perf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eulke/kndo"
publish = false # until 1.0 (ADR 0007: reserve names early regardless)

[workspace.dependencies]
smol_str = { version = "0.3", features = ["serde"] }
blake3 = { version = "1", features = ["rayon"] }
ignore = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
toml = "0.8"
roxmltree = "0.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rkyv = "0.8"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
num_cpus = "1"
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
