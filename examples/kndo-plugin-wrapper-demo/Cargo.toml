[package]
name = "kndo-plugin-wrapper-demo"
description = "Reference wrapper plugin for kndo-plugin-api v1 — an external plugin whose descriptor declares dependencies on a BUILT-IN, proving plugin co-activation with real components: when this plugin's own activation rule fires, kndo:express activates by implication even though no manifest declares express. Not shipped with kndo (excluded from the workspace) — built and loaded as an external component by crates/kndo's plugin-dependency integration test."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
