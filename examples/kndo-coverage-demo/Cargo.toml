[package]
name = "kndo-coverage-demo"
description = "Reference external coverage ingester for kndo-plugin-api's coverage-ingester world — parses a trivial invented report format to prove the unidirectional ABI end to end. Not shipped with kndo (deliberately excluded from the workspace, same as the other examples) — built and loaded as an external component by kndo-plugin-api's own compliance suite."
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
